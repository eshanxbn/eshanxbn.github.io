<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wefi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#00a6fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-wefi)"/>
  <rect x="80" y="60" width="640" height="380" rx="16" fill="#030712" stroke="rgba(34,211,238,0.2)" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="80" y="60" width="640" height="40" rx="16" fill="#0b0f19"/>
  <circle cx="110" cy="80" r="6" fill="#ef4444"/>
  <circle cx="130" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="80" r="6" fill="#10b981"/>
  <text x="400" y="85" fill="#38bdf8" font-family="sans-serif" font-size="14" text-anchor="middle">WEFI — Investment & Financial Ecosystem</text>
  
  <!-- Financial Widgets -->
  <rect x="110" y="130" width="180" height="110" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="130" y="165" fill="#9ca3af" font-family="sans-serif" font-size="12">TOTAL ASSETS UNDER MGMT</text>
  <text x="130" y="200" fill="#22d3ee" font-family="sans-serif" font-size="24" font-weight="bold">$42.8M</text>

  <rect x="310" y="130" width="180" height="110" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="330" y="165" fill="#9ca3af" font-family="sans-serif" font-size="12">ACTIVE LEASE AGREEMENTS</text>
  <text x="330" y="200" fill="#818cf8" font-family="sans-serif" font-size="24" font-weight="bold">12,450</text>

  <rect x="510" y="130" width="190" height="110" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="530" y="165" fill="#9ca3af" font-family="sans-serif" font-size="12">API TRANSACTION RATE</text>
  <text x="530" y="200" fill="#34d399" font-family="sans-serif" font-size="24" font-weight="bold">99.99%</text>

  <!-- Financial Chart -->
  <rect x="110" y="260" width="590" height="150" rx="10" fill="#090d16" stroke="rgba(34,211,238,0.3)"/>
  <path d="M 130 380 Q 250 290, 380 320 T 520 280 T 680 270 L 680 390 L 130 390 Z" fill="rgba(34,211,238,0.15)"/>
  <path d="M 130 380 Q 250 290, 380 320 T 520 280 T 680 270" fill="none" stroke="#22d3ee" stroke-width="3"/>

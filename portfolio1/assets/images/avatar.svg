<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shirt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#avatar-bg)"/>
  
  <!-- Glowing inner circle -->
  <circle cx="200" cy="200" r="175" fill="#090d16"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#avatar-bg)" stroke-width="4"/>

  <!-- Head / Hair Vector -->
  <!-- Body / Shoulders -->
  <path d="M 90 360 C 90 280, 310 280, 310 360 Z" fill="url(#shirt-bg)" stroke="#4f46e5" stroke-width="3"/>
  <path d="M 170 260 L 230 260 L 215 310 L 185 310 Z" fill="#e2e8f0" opacity="0.9"/>
  
  <!-- Neck -->
  <rect x="175" y="210" width="50" height="60" rx="8" fill="#e2e8f0"/>

  <!-- Face -->
  <rect x="150" y="110" width="100" height="120" rx="30" fill="#f8fafc"/>
  
  <!-- Glasses / Modern Specs -->
  <rect x="160" y="145" width="35" height="25" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="205" y="145" width="35" height="25" rx="4" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="195" y1="157" x2="205" y2="157" stroke="#0f172a" stroke-width="4"/>

  <!-- Hair -->
  <path d="M 145 125 C 145 75, 255 75, 255 125 C 240 100, 160 100, 145 125 Z" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 185 200 Q 200 210 215 200" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Tech Badges Overlay -->
  <g transform="translate(40, 320)">
    <rect width="90" height="32" rx="16" fill="#4f46e5"/>
    <text x="45" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LARAVEL</text>
  </g>
  <g transform="translate(270, 320)">
    <rect width="90" height="32" rx="16" fill="#0284c7"/>
    <text x="45" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">NEXT.JS</text>
  </g>
</svg>

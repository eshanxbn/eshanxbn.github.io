  <rect x="110" y="230" width="590" height="180" rx="8" fill="#111827" stroke="url(#card-glow)" stroke-width="1.5"/>
  
  <!-- Metric Charts -->
  <path d="M 140 370 Q 250 310, 360 340 T 580 270 T 670 290" fill="none" stroke="#22d3ee" stroke-width="4"/>
  <text x="140" y="270" fill="#f9fafb" font-family="sans-serif" font-size="18" font-weight="bold">QA Automation Score: 99.8%</text>

      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="180" fill="#4f46e5" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Dashboard Wireframe -->
  <rect x="80" y="60" width="640" height="380" rx="16" fill="#090d16" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="80" y="60" width="640" height="40" rx="16" fill="#111827"/>
  <circle cx="110" cy="80" r="6" fill="#ef4444"/>
  <circle cx="130" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="80" r="6" fill="#10b981"/>
  <text x="400" y="85" fill="#9ca3af" font-family="sans-serif" font-size="14" text-anchor="middle">QA Brains — AI Automated Testing Platform</text>
  
  <!-- Content Mockup -->
  <rect x="110" y="120" width="160" height="90" rx="8" fill="#1f2937"/>
